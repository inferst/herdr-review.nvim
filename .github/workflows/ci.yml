name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Neovim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Install plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git deps/plenary.nvim

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes luarocks
          sudo luarocks install luacheck

      - name: Run tests
        run: make test PLENARY_PATH=deps/plenary.nvim

      - name: Run Luacheck
        run: make lint

  format:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua tests
